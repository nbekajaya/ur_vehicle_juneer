<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Rover GUI</title>
    <link rel="stylesheet" href="css/style.css" />

    <script src="vendor/apriltag-js/js/tag-families.js"></script>
    <script src="vendor/apriltag-js/js/overlay-renderer.js"></script>
    <script src="vendor/apriltag-js/js/detector-manager.js"></script>

</head>
<body>
    <header>
        <h1>Rover</h1>
        <div id="status">
            <span id="transport-status">transport: disconnected</span>
            <span id="camera-status">camera: off</span>
            <span id="vision-status">vision: idle</span>
        </div>
        <div id="actions">
            <button id="btn-connect">Connect</button>
            <button id="btn-disconnect" disabled>Disconnect</button>
            <button id="btn-camera">Start Camera</button>
            <button id="btn-estop" class="danger">E-STOP</button>
        </div>
    </header>

    <main>
        <section id="camera-area">
            <video id="camera" autoplay muted playsinline style="display:none"></video>
              <canvas id="displayCanvas"></canvas>
        </section>

        <!-- sidebar for control and shitzz -->
        <aside id="side">

        <section id="help">
            <h2>Controls</h2>
            <p>W/A/S/D for Direction</p>
            <p>J/K for Magnitude</p>
            <p>Space to stop</p>
            <canvas id="vector-display"></canvas>
        </section>

        <section id="network-panel">
            <h2>Network</h2>
            <div class="network-input-container">
                <input
                class="network-input-field"
                id="wifi-input"
                type="text"
                placeholder="WI-FI SSID"
                autocomplete="off"
                spellcheck="false"
                />
                <input
                class="network-input-field"
                id="pass-input"
                type="text"
                placeholder="WI-FI password"
                autocomplete="off"
                spellcheck="false"
                />
                <button id="network-send">Send</button>
            </div>
            <div class="network-input-meta">
                <span id="network-status"></span>
            </div>
            <div id="network-output" data-state="empty">no messages</div>
        </section>

        <section id="vision">
            <h2>April Tags</h2>
            <div id="vision-list">No tags</div>
        </section>

        <section id="filters">
            <h2>Cam Feed Filters</h2>
        </section>

        </aside>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>`
